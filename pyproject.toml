[project]
name = "numu-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for the NUMU e-commerce platform — lets any MCP-compatible AI read and operate a merchant's store."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "NUMU" }]
dependencies = [
    "mcp[cli]>=1.2.0,<2",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
]

[project.scripts]
numu-mcp = "numu_mcp.server:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/numu_mcp"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
