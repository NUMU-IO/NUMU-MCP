[project]
name = "numu-mcp"
version = "0.1.0"
description = "NUMU MCP server — connect any AI (Claude, ChatGPT, Cursor, ...) to a NUMU store"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4,<4",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
